# TellMeYourMods mod database.
#
# <Mod display name>:
#   color: "&#RRGGBB"      optional, ignored when blacklisted (colors.blacklisted wins)
#   blacklisted: true      optional, default false
#   min-matches: 1         optional, overrides detection.min-matches
#   keys:                  translation keys owned by the mod
#     - "some.translation.key"
#     - "some.other.key=Expected value"   optional expected value after the first "="
#
# A key only counts when the client sends back text that is not the probe sentinel,
# not the raw key and, when set, equal to the expected value.
# Keys marked "uncertain" were not verified against the mod's language files.
# Do not use dots in display names.


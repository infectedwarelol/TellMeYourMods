name: TellMeYourMods
version: '${version}'
main: dev.infectedware.tellmeyourmods.TellMeYourMods
api-version: '1.20'
author: infectedware
description: idk, get ppl mod
folia-supported: true
depend: [packetevents]
commands:
  tmym:
    description: Check a player for possible client mods or reload the plugin.
    usage: /tmym <check <player>|reload>
    permission: tellmeyourmods.admin
permissions:
  tellmeyourmods.admin:
    description: Use /tmym check and /tmym reload.
    default: op
  tellmeyourmods.notify:
    description: Receive possible mod reports.
    default: op
  tellmeyourmods.bypass:
    description: Never probed for client mods.
    default: false
